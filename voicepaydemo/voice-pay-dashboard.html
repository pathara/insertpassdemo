<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Voice Pay Dashboard</title><style>
:root{--navy:#0b2d67;--blue:#087bd9;--cyan:#39d7f6;--ink:#17355f;--line:#dbe8f4;--muted:#6c829b}*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;background:#d9f2ff;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{width:min(100vw,56.25vh);height:min(100vh,177.7778vw);max-width:1080px;max-height:1920px;aspect-ratio:9/16;overflow:hidden;margin:0 auto;padding:1.5% 2.2%;background:radial-gradient(ellipse at 50% 0,#fff 0,#eaf8ff 42%,#b3e4ff 100%)}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px;padding:18px 20px;background:#ffffffd9;border:1px solid white;border-radius:20px}.brand{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:1000;color:var(--navy)}.brand img{width:100px;height:62px;object-fit:contain}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#edf5fc;color:var(--navy)}.lang{background:#dff5ff;color:#0759a7}.panel{background:#ffffffdf;border:1px solid white;border-radius:20px;padding:22px;margin-top:18px;box-shadow:0 12px 35px #1463a014}.panel h2{margin:0 0 8px;font-size:24px;color:var(--navy)}.help{color:var(--muted);font-size:15px;line-height:1.4;margin-bottom:18px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:13px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:15px}.table th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.preview{width:94px;height:94px;object-fit:contain;background:white;border:1px solid var(--line);border-radius:14px}.input{padding:11px;border:1px solid #c7dced;border-radius:10px;font-size:16px;width:100%}.price{width:140px}.browse{display:inline-block;padding:10px 12px;background:#e9f6ff;border-radius:9px;font-weight:900;color:#0759a7;cursor:pointer;white-space:nowrap}.browse input{display:none}.filename{font-size:11px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:5px}.update{background:linear-gradient(100deg,#0a55c5,#1cbde9);color:#fff;padding:15px 24px;font-size:17px}.update:disabled{background:#cbd5df;color:#7b8793;cursor:not-allowed}.actions{display:flex;justify-content:flex-end;margin-top:18px}.saved{font-weight:900;color:#0c9969;margin-right:auto;align-self:center}.floatdash{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:9px;z-index:50}.floatdash a{background:linear-gradient(100deg,#0a55c5,#1cbde9);color:#fff;text-decoration:none;padding:13px 16px;border-radius:13px;font-weight:1000;font-size:14px;box-shadow:0 8px 24px #0056a533}@media(max-aspect-ratio:9/16){.wrap{width:100vw;height:100vh;aspect-ratio:auto;padding:1.5% 2.2%}}@media(max-width:1100px){.wrap{width:100%;min-height:100vh;padding:14px}.table{min-width:780px}.top{align-items:flex-start}.brand{font-size:20px}.brand img{width:75px;height:50px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand"><img src="asset/paydollar-logo.png" alt="PayDollar"><span id="title">VOICE PAY DASHBOARD</span></div><div class="help" id="subtitle" style="margin:8px 0 0">Manage gift names, images and prices (HKD).</div></div><div class="top-actions"><button class="btn lang" id="langBtn">TC</button><a class="btn secondary" href="voice-pay.html" id="backVoice">Back to Voice Pay</a></div></header><section class="panel"><h2 id="heading">Gift Management (A–E)</h2><div class="help" id="hint">All prices default to HK$0.00. Browse to select a local image; it will be stored in this browser for the demo.</div><div class="tablewrap"><table class="table"><thead><tr><th>Gift</th><th>Preview</th><th>Gift Name</th><th>Price (HKD)</th><th>Image</th><th>Show Image</th></tr></thead><tbody id="rows"></tbody></table></div><div class="actions"><span class="saved" id="saved"></span><button class="btn update" id="update" disabled>Update All Changes</button></div></section></main><nav class="floatdash"><a href="voice-pay.html" id="openVoice">Back to Voice Pay</a></nav><script>
const KEY='asiapayVoicePayConfigV1';const defaults=[{id:'A',name:'',price:0,image:'asset/prize-1.png',showImage:true},{id:'B',name:'',price:0,image:'asset/prize-2.png',showImage:true},{id:'C',name:'',price:0,image:'asset/prize-3.png',showImage:true},{id:'D',name:'',price:0,image:'asset/prize-4.png',showImage:true},{id:'E',name:'',price:0,image:'asset/smile-draw.png',showImage:true}];let savedData=load(),draft=JSON.parse(JSON.stringify(savedData));let dirty=false;function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.gifts))return {gifts:defaults.map(d=>({...d,...(x.gifts.find(g=>g.id===d.id)||{})}))}}catch(e){}return {gifts:JSON.parse(JSON.stringify(defaults))}}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){document.getElementById('rows').innerHTML=draft.gifts.map(g=>`<tr data-id="${g.id}"><td><b>${g.id}</b></td><td><img class="preview" src="${g.image}" id="preview-${g.id}" alt="Gift ${g.id}"></td><td><input class="input name" value="${esc(g.name||'')}" placeholder="Gift ${g.id}"></td><td><input class="input price" type="number" min="0" step="0.01" value="${Number(g.price||0).toFixed(2)}"></td><td><label class="browse">Browse image<input type="file" accept="image/*" class="file"></label><div class="filename" id="file-${g.id}">${g.image.startsWith('data:')?'Custom image':esc(g.image.split('/').pop())}</div></td><td><label><input type="checkbox" class="show" ${g.showImage!==false?'checked':''}> Show</label></td></tr>`).join('');document.querySelectorAll('#rows input').forEach(i=>i.addEventListener('input',onEdit));document.querySelectorAll('#rows .file').forEach(i=>i.addEventListener('change',onFile));document.getElementById('update').disabled=!dirty}function onEdit(e){const tr=e.target.closest('tr'),g=draft.gifts.find(x=>x.id===tr.dataset.id);if(e.target.classList.contains('name'))g.name=e.target.value;if(e.target.classList.contains('price'))g.price=Math.max(0,Number(e.target.value)||0);if(e.target.classList.contains('show'))g.showImage=e.target.checked;setDirty()}function onFile(e){const file=e.target.files[0];if(!file)return;const tr=e.target.closest('tr'),g=draft.gifts.find(x=>x.id===tr.dataset.id);const r=new FileReader();r.onload=()=>{g.image=r.result;document.getElementById('preview-'+g.id).src=g.image;document.getElementById('file-'+g.id).textContent=file.name;setDirty()};r.readAsDataURL(file)}function setDirty(){dirty=JSON.stringify(draft)!==JSON.stringify(savedData);document.getElementById('update').disabled=!dirty;document.getElementById('saved').textContent=dirty?'Unsaved changes':''}document.getElementById('update').onclick=()=>{localStorage.setItem(KEY,JSON.stringify(draft));savedData=JSON.parse(JSON.stringify(draft));dirty=false;document.getElementById('saved').textContent='Saved';document.getElementById('update').disabled=true};
const T={EN:{title:'VOICE PAY DASHBOARD',subtitle:'Manage gift names, images and prices (HKD).',heading:'Gift Management (A–E)',hint:'All prices default to HK$0.00. Browse to select a local image; it will be stored in this browser for the demo.',gift:'Gift',preview:'Preview',name:'Gift Name',price:'Price (HKD)',image:'Image',show:'Show Image',browse:'Browse image',update:'Update All Changes',back:'Back to Voice Pay',switch:'',open:'Back to Voice Pay'},TC:{title:'VOICE PAY 控制台',subtitle:'管理 A–E 禮品名稱、圖片及價格（港幣）。',heading:'禮品管理（A–E）',hint:'所有禮品預設價格為 HK$0.00。選擇本機圖片後，圖片會儲存在此瀏覽器供示範使用。',gift:'禮品',preview:'預覽',name:'禮品名稱',price:'價格（港幣）',image:'圖片',show:'顯示圖片',browse:'選擇圖片',update:'更新所有變更',back:'返回 Voice Pay',switch:'幸運抽獎控制台',open:'返回 Voice Pay'}};let lang=localStorage.getItem('asiapayLuckyDrawLang')||'EN';function applyLang(){const t=T[lang];document.getElementById('langBtn').textContent=lang==='EN'?'TC':'EN';document.getElementById('title').textContent=t.title;document.getElementById('subtitle').textContent=t.subtitle;document.getElementById('heading').textContent=t.heading;document.getElementById('hint').textContent=t.hint;document.getElementById('backVoice').textContent=t.back;document.getElementById('openVoice').textContent=t.open;const th=document.querySelectorAll('thead th');[t.gift,t.preview,t.name,t.price,t.image,t.show].forEach((v,i)=>th[i].textContent=v);document.querySelectorAll('.browse').forEach(x=>x.childNodes[0].textContent=t.browse)}document.getElementById('langBtn').onclick=()=>{lang=lang==='EN'?'TC':'EN';localStorage.setItem('asiapayLuckyDrawLang',lang);applyLang()};render();applyLang();
</script></body></html>
