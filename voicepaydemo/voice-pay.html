<html lang="en">
<head>

<title>PayDollar Voice Pay — Gift Draw Demo</title>
<style>
:root{--navy:#082f78;--blue:#075dd0;--cyan:#21c8f1;--violet:#824dff;--ink:#103d78;--pale:#eaf8ff;--gold:#ffd34f}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;caret-color:transparent}[hidden]{display:none!important}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:#d8f2ff}
.kiosk{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.7778vw);max-width:1080px;max-height:1920px;aspect-ratio:9/16;margin:auto;overflow:hidden;background:radial-gradient(ellipse at 50% 0,#fff 0%,#eaf9ff 33%,#b5e6ff 68%,#5ab9f2 100%);display:flex;flex-direction:column;box-shadow:0 0 60px #146db033}

.intro{position:absolute;inset:0;z-index:100;background:#071a43;cursor:pointer;display:block}.intro img{width:100%;height:100%;object-fit:cover;display:block}.intro:after{content:"TAP TO START";position:absolute;left:50%;bottom:2.5%;transform:translateX(-50%);padding:.7em 1.3em;border-radius:999px;background:#072f9bcc;color:white;font-size:clamp(12px,1.5vh,22px);font-weight:1000;letter-spacing:.1em;box-shadow:0 0 22px #1be0ff88;animation:tapPulse 1.8s infinite}
.top{height:8.5%;min-height:72px;max-height:165px;flex-shrink:0;position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:1.4% 4%;background:#ffffffc9;backdrop-filter:blur(18px);border-bottom:1px solid #fff}
.brand{display:flex;align-items:center;gap:2.5%;min-width:0}.brand img{width:clamp(75px,10vw,155px);height:clamp(42px,5.2vh,100px);object-fit:contain}.brand span{font-size:clamp(21px,3.2vh,44px);font-weight:1000;color:#104a9b;white-space:nowrap}.topright{display:flex;align-items:center;gap:12px}.status{font-size:clamp(11px,1.4vh,20px);font-weight:900;letter-spacing:.08em;color:#3974a8}.lang{border:0;border-radius:13px;padding:clamp(8px,1.2vh,17px) clamp(11px,1.5vw,20px);background:white;color:#0756b5;font-weight:1000;box-shadow:0 5px 15px #1767a51a;cursor:pointer}
.gift-zone{position:relative;z-index:1;flex:0 0 auto;padding:1% 2.6% 1.1%;display:flex;flex-direction:column;justify-content:center;min-height:0}.zone-title{font-size:clamp(12px,1.5vh,21px);font-weight:1000;letter-spacing:.16em;color:#4c83b4;text-align:center;margin:0 0 1.2%;text-transform:uppercase}.giftbar{width:100%;height:auto;aspect-ratio:5/1;flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1.3%;padding:1.3%;border-radius:clamp(15px,2.2vh,28px);background:linear-gradient(120deg,#ffffffb8,#dff6ff9c);border:1px solid #ffffffed;box-shadow:0 10px 32px #146bb01c;min-height:0}.gift{min-width:0;min-height:0;position:relative;border:2px solid transparent;border-radius:clamp(12px,1.8vh,22px);background:#ffffffde;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%;overflow:hidden;transition:border-color .25s,transform .25s,box-shadow .25s;padding:3% 1.5%;text-align:center}.gift .letter{font-size:clamp(26px,4vh,54px);font-weight:1000;color:#1056a7;line-height:1}.gift .gift-img{display:block;position:absolute;top:8%;left:8%;width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 7px 8px #174f8220);opacity:0;transition:opacity 1.5s ease-in;pointer-events:none}.gift.revealed .letter,.gift.revealed .gname,.gift.revealed .gprice{display:none!important}.giftbar.images-visible .gift.revealed .gift-img{opacity:1}.gift .gname,.gift .gprice{display:none}.gift.lit{border-color:#ffcc39;transform:translateY(-2.5%);box-shadow:0 0 0 3px #ffcf4c44,0 0 28px #ffc52dbd,0 8px 20px #1b6bb322;animation:goldGlow .7s ease-in-out infinite alternate}.gift.lit:after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,#fffebfba 49%,transparent 56%);animation:sweep 1.1s linear infinite;pointer-events:none}.gift.winner{border-color:#fff09a;box-shadow:0 0 0 5px #ffd44f66,0 0 36px #fff0a9,0 0 65px #1dcfff66;transform:scale(1.035)}
.payment-zone{position:relative;z-index:1;flex:1;min-height:0;padding:0 4% 5%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.zone-separator{width:86%;height:2px;background:linear-gradient(90deg,transparent,#ffffff,#58bdf0,#ffffff,transparent);margin:0 auto 2.2%;flex-shrink:0}.payment-panel{width:100%;flex:1;min-height:0;border:1px solid #ffffffed;border-radius:clamp(22px,3vh,38px);background:linear-gradient(145deg,#ffffffd9,#e8f8ffb8);box-shadow:0 18px 45px #1264a522;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3.5% 4%;overflow:hidden;position:relative}.panel-kicker{font-size:clamp(13px,1.7vh,22px);font-weight:1000;letter-spacing:.12em;color:#5384b3;text-transform:uppercase;margin:0 0 1.5%}.panel-title{font-size:clamp(25px,4vh,50px);line-height:1.12;font-weight:1000;color:#0a408e;margin:0 0 2%;text-wrap:balance}.panel-copy{font-size:clamp(14px,1.8vh,23px);line-height:1.35;color:#416991;margin:0 0 2%;max-width:90%}.mic-wrap{position:relative;width:clamp(90px,15vh,190px);aspect-ratio:1;display:grid;place-items:center;margin:1.5% 0 3%;flex-shrink:0}.mic{width:76%;height:76%;border:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#0759d1,#23d0f4);color:white;font-size:clamp(38px,7vh,86px);box-shadow:0 10px 25px #086cc744;position:relative;cursor:pointer}.mic:before,.mic:after{content:"";position:absolute;inset:-10%;border:3px solid #22bdf2aa;border-radius:50%;opacity:0}.mic.listening{animation:micPulse 1.3s ease-in-out infinite}.mic.listening:before,.mic.listening:after{animation:micRing 1.8s ease-out infinite}.mic.listening:after{animation-delay:.9s}.mic-help{font-size:clamp(12px,1.5vh,19px);font-weight:800;color:#5881a7;margin:0 0 2%}.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:2.2%;row-gap:7%;width:100%;margin-top:4%;flex-shrink:0}.method{border:2px solid transparent;background:#fff;border-radius:clamp(12px,1.8vh,22px);padding:4% 3%;min-height:clamp(58px,8vh,112px);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 7px 18px #1767a51a;transition:.2s}.method img{width:100%;height:100%;max-height:clamp(35px,5.5vh,72px);object-fit:contain}.method.active{border-color:#ffca38;box-shadow:0 0 0 4px #ffd34f4d,0 0 28px #ffc32dbb;transform:translateY(-3px)}.btnrow{display:flex;gap:2.5%;justify-content:center;flex-wrap:nowrap;width:100%;margin-top:3%}.btn{border:0;border-radius:clamp(12px,1.8vh,22px);padding:clamp(11px,1.6vh,20px) clamp(12px,2vw,26px);font-size:clamp(15px,2vh,24px);font-weight:1000;cursor:pointer;box-shadow:0 8px 20px #075bb51e}.primary{background:linear-gradient(100deg,#0758ce,#20c8ef);color:white}.light{background:#fff;color:#0a4b9c;border:1px solid #fff}.gold{background:linear-gradient(100deg,#ffbf30,#ffe77a);color:#133d79}.say-hint{font-size:clamp(13px,1.7vh,21px);font-weight:900;color:#3c6795;margin-top:3%}.status-big{font-size:clamp(30px,4.8vh,58px);font-weight:1000;color:#0c509c;margin:1.5% 0}.payment-completed{font-size:clamp(28px,4.4vh,52px);font-weight:1000;color:#0c509c;margin:1.4% 0 0}#paidInfo{width:100%;height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding-top:15%;min-height:0}#paidInfo .status-big{margin-top:0;margin-bottom:1.2%}#paidMethod{font-size:clamp(19px,2.6vh,32px);line-height:1.3;margin-top:clamp(44px,8vh,145px);margin-bottom:0}#drawingText{margin-top:3%;font-size:clamp(36px,6.5vh,76px);line-height:1.05;font-weight:1000;color:#0758ce;text-shadow:0 3px 0 #ffffffb0;letter-spacing:.03em}#drawingText.countdown{font-size:clamp(72px,13vh,150px);font-weight:1000;color:#0758ce;text-shadow:0 6px 0 #ffffffb8,0 0 28px #22bff5aa;animation:countPop .65s cubic-bezier(.2,1.5,.4,1) both}.payment-panel.confirm-mode{justify-content:space-around;padding-top:5%;padding-bottom:6%}.payment-panel.confirm-mode .panel-kicker{margin-bottom:2.5%}.payment-panel.confirm-mode .panel-title{margin-bottom:3.2%;font-size:clamp(28px,4.4vh,54px)}.payment-panel.confirm-mode .panel-copy{margin-bottom:3.5%;font-size:clamp(16px,2.1vh,26px)}.payment-panel.confirm-mode .mic-wrap{margin:2.5% 0 3.5%}.payment-panel.confirm-mode .methods{margin-top:4%;row-gap:9%}.payment-panel.confirm-mode .btnrow{margin-top:5%}#resultInfo{width:100%;height:100%;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.35%;padding:0;transform:translateY(-16%)}#resultInfo .status-big{margin:0 0 .25%;font-size:clamp(30px,4.5vh,54px)}#resultInfo .result-name{order:1;font-size:clamp(28px,4.2vh,50px);line-height:1.05;margin:0 0 .25%}#resultInfo .gift-result-img{order:2;width:clamp(220px,29vh,350px);height:clamp(220px,29vh,350px);margin:0}#resultInfo .btnrow{order:3;width:100%;margin-top:1%;gap:3%}#resultInfo .btn{flex:1;max-width:48%;padding-left:2%;padding-right:2%;white-space:normal}.gift-result-img{width:clamp(180px,30vh,360px);height:clamp(180px,30vh,360px);object-fit:contain;filter:drop-shadow(0 16px 20px #1c75b933);animation:float 2s ease-in-out infinite}.result-name{font-size:clamp(26px,4vh,50px);font-weight:1000;color:#073f8e;margin:1% 0}.result-price{font-size:clamp(15px,2vh,24px);font-weight:900;color:#1681d0}.reveal{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at center,#f9feff 0,#a8e4ffeb 42%,#2088dbeF 100%)}.reveal.show{display:flex}.reveal:before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,#ffffff00 0deg 7deg,#ffffff88 7deg 10deg,#22a5f31a 10deg 16deg);animation:rays 10s linear infinite}.reveal-ring{position:absolute;width:72%;aspect-ratio:1;border-radius:50%;border:4px solid #fff9;box-shadow:0 0 35px #fff, inset 0 0 35px #fff;animation:ring 2s ease-in-out infinite}.reveal-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;max-width:92%;max-height:90%;padding:3%;background:transparent;border:0;box-shadow:none}.reveal-img{width:clamp(220px,37vh,450px);height:clamp(220px,37vh,450px);object-fit:contain;filter:drop-shadow(0 18px 22px #054a8c4d);animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}.reveal-rank{font-size:clamp(22px,3.5vh,44px);font-weight:1000;color:#0879d8;text-shadow:0 2px #fff}.reveal-name{font-size:clamp(28px,4.5vh,54px);font-weight:1000;color:#073b87;text-shadow:0 2px #fff}
.dash-shortcut{position:absolute;right:2.5%;bottom:1.4%;z-index:30;border:0;border-radius:999px;padding:1.1% 2.2%;font-size:clamp(10px,1.25vh,15px);font-weight:1000;color:#fff;background:linear-gradient(100deg,#0759c8,#22c9ee);box-shadow:0 7px 18px #0866b533;cursor:pointer}.intro[hidden],.reveal[hidden]{display:none!important}
@keyframes countPop{0%{opacity:0;transform:scale(.45)}45%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}@keyframes micPulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.06);filter:brightness(1.2)}}@keyframes micRing{0%{transform:scale(.8);opacity:.85}100%{transform:scale(1.4);opacity:0}}@keyframes goldGlow{from{filter:brightness(1)}to{filter:brightness(1.15)}}@keyframes sweep{to{transform:translateX(100%)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes rays{to{transform:rotate(360deg)}}@keyframes ring{0%,100%{transform:scale(.9);opacity:.55}50%{transform:scale(1.08);opacity:1}}@keyframes pop{0%{transform:scale(.35);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}@keyframes tapPulse{0%,100%{opacity:.72;transform:translateX(-50%) scale(.98)}50%{opacity:1;transform:translateX(-50%) scale(1.03)}}
@media(max-aspect-ratio:9/16){.kiosk{width:100vw;height:100vh;aspect-ratio:auto}.brand img{width:22%;min-width:70px}.brand span{font-size:clamp(18px,2.8vh,34px)}.top{min-height:64px}.gift-zone{flex-basis:24%}.giftbar{gap:1%;padding:1%}.gift .letter{font-size:clamp(21px,3.2vh,38px)}.payment-panel{padding:3%}.methods{gap:1.5%}.method{min-height:clamp(48px,7vh,85px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style></head>
<body>
<div class="kiosk" id="kiosk">
  <button class="intro" id="intro" aria-label="Tap to start Voice Pay"><img src="asset/intro-draft.png" alt="Voice Pay introduction — tap to start"></button>
  <header class="top"><div class="brand"><img src="asset/paydollar-logo.png" alt="PayDollar"><span>Voice Payment</span></div><div class="topright"><button class="lang" id="langBtn">TC</button></div></header>
  <section class="gift-zone"><div class="giftbar" id="giftBar"></div></section>
  <main class="payment-zone"><div class="zone-separator"></div><section class="payment-panel" id="paymentPanel">
    <div class="panel-kicker" id="panelKicker">VOICE PAY · PAYMENT</div><h1 class="panel-title" id="panelTitle">How would you like to pay today?</h1><p class="panel-copy" id="panelCopy">Tap a payment method or use the microphone to say its name.</p>
    <div class="mic-wrap"><button class="mic listening" id="micBtn" aria-label="Start voice payment selection">🎙</button></div><p class="mic-help" id="micHelp">Choose a payment method below, or tap the mic to speak.</p>
    <div class="methods" id="methods">
      <button class="method" data-method="Alipay"><img src="asset/alipay.png" alt="Alipay"></button>
      <button class="method" data-method="Apple Pay"><img src="asset/applepay.png" alt="Apple Pay"></button>
      <button class="method" data-method="Google Pay"><img src="asset/googlepay.png" alt="Google Pay"></button>
      <button class="method" data-method="Octopus"><img src="asset/octopus.png" alt="Octopus"></button>
      <button class="method" data-method="WeChat Pay"><img src="asset/wechatpay.png" alt="WeChat Pay"></button>
      <button class="method" data-method="PayMe"><img src="asset/payme.png" alt="PayMe"></button>
    </div>
    <div id="confirmControls" class="btnrow" hidden><button class="btn primary" id="yesBtn">YES, CONFIRM</button><button class="btn light" id="noBtn">NO, TRY AGAIN</button></div>
    <div id="paidInfo" hidden><div class="status-big">HK$0.00</div><div class="payment-completed">Payment Completed</div><div class="panel-copy" id="paidMethod">Paid with: —</div><div class="say-hint" id="drawingText" hidden>3</div></div>
    <div id="resultInfo" hidden><div class="status-big" id="resultTitle">Congratulations!</div><div class="result-name" id="resultName">Gift A</div><img class="gift-result-img" id="resultImg" src="asset/prize-1.png" alt="Your gift"><div class="btnrow"><button class="btn light" id="aboutBtn">ABOUT VOICE PAY</button><button class="btn primary" id="againBtn">PLAY AGAIN</button></div></div>
  </section></main>
  <button class="dash-shortcut" id="dashboardBtn">Voice Pay Dashboard</button>
  <div class="reveal" id="reveal" aria-live="polite"><div class="reveal-ring"></div><div class="reveal-content"><img class="reveal-img" id="revealImg" src="asset/prize-1.png" alt="Gift reveal"><div class="reveal-rank" id="revealRank">Gift A</div><div class="reveal-name" id="revealName">Gift A</div></div></div>
</div>
<script>
const CONFIG_KEY='asiapayVoicePayConfigV1';
const defaults=[{id:'A',name:'',price:0,image:'asset/prize-1.png',showImage:true},{id:'B',name:'',price:0,image:'asset/prize-2.png',showImage:true},{id:'C',name:'',price:0,image:'asset/prize-3.png',showImage:true},{id:'D',name:'',price:0,image:'asset/prize-4.png',showImage:true},{id:'E',name:'',price:0,image:'asset/smile-draw.png',showImage:true}];
const rankNames={A:'1st Gift',B:'2nd Gift',C:'3rd Gift',D:'4th Gift',E:'5th Gift'};
let lang=localStorage.getItem('asiapayLuckyDrawLang')||'EN',chosenMethod='',state='payment',isDrawing=false,drawTimer=null,speechRec=null,drawIndex=0,winner=null,autoListen=false;
function loadGifts(){try{const cfg=JSON.parse(localStorage.getItem(CONFIG_KEY));return defaults.map(d=>{const v=cfg?.gifts?.find(x=>x.id===d.id)||{};return {...d,...v,name:(v.name||'').trim()||('Gift '+d.id),price:Number.isFinite(Number(v.price))?Number(v.price):0,image:v.image||d.image,showImage:v.showImage!==false}})}catch(e){return defaults.map(d=>({...d,name:d.id}))}}
let gifts=loadGifts();
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function buildGiftBar(revealImages=false){const bar=document.getElementById('giftBar');bar.classList.remove('images-visible');bar.innerHTML='';gifts.forEach(g=>{const b=document.createElement('div');b.className='gift'+(revealImages?' revealed':'');b.dataset.id=g.id;b.innerHTML=`<div class="letter">${g.id}</div><img class="gift-img" src="${esc(g.image)}" alt=""><div class="gname">${esc(g.name)}</div><div class="gprice">HK$${g.price.toFixed(2)}</div>`;const im=b.querySelector('.gift-img');if(revealImages&&!g.showImage){im.style.display='none'}bar.appendChild(b)});if(revealImages){requestAnimationFrame(()=>requestAnimationFrame(()=>bar.classList.add('images-visible')))}}
function setLit(id){document.querySelectorAll('.gift').forEach(el=>el.classList.toggle('lit',el.dataset.id===id))}
function startAmbientDraw(){if(isDrawing)return;isDrawing=true;document.getElementById('micBtn').classList.add('listening');let i=0;drawTimer=setInterval(()=>{setLit(gifts[i%gifts.length].id);i++},430)}
function stopDraw(){if(drawTimer){clearInterval(drawTimer);drawTimer=null}isDrawing=false;document.querySelectorAll('.gift').forEach(el=>el.classList.remove('lit'))}
function setLanguage(){document.getElementById('langBtn').textContent=lang==='EN'?'TC':'EN';document.getElementById('dashboardBtn').textContent=lang==='EN'?'Voice Pay Dashboard':'Voice Pay 控制台';if(state==='payment'){document.getElementById('panelKicker').textContent=lang==='EN'?'VOICE PAYMENT':'語音付款';document.getElementById('panelTitle').textContent=lang==='EN'?'How would you like to pay today?':'今天您想如何付款？';document.getElementById('panelCopy').textContent=lang==='EN'?'Tap a payment method or say its name to the microphone.':'點擊付款方式，或對著麥克風說出付款方式。';document.getElementById('micHelp').textContent=lang==='EN'?'Listening for your payment method…':'正在聆聽您的付款方式⋯';}else if(state==='confirm'){document.getElementById('panelKicker').textContent=lang==='EN'?'PAYMENT METHOD RECOGNIZED':'已識別付款方式';document.getElementById('panelTitle').textContent=(lang==='EN'?'You said: ':'您說：')+chosenMethod;document.getElementById('panelCopy').textContent=lang==='EN'?'Is that correct? Say “Yes” or “No”.':'是否正確？請說「是」或「否」。';}else if(state==='paid'||state==='drawing'){document.getElementById('panelKicker').textContent='';document.getElementById('panelCopy').textContent='';document.getElementById('paidMethod').textContent=(lang==='EN'?'Paid with: ':'付款方式：')+chosenMethod;}else if(state==='result'){document.getElementById('resultTitle').textContent=lang==='EN'?'Congratulations!':'恭喜！';}document.getElementById('yesBtn').textContent=lang==='EN'?'YES, CONFIRM':'是，確認';document.getElementById('noBtn').textContent=lang==='EN'?'NO, TRY AGAIN':'否，重新選擇';document.getElementById('aboutBtn').textContent=lang==='EN'?'ABOUT VOICE PAY':'關於 Voice Pay';document.getElementById('againBtn').textContent=lang==='EN'?'PLAY AGAIN':'再玩一次'}
function choosePayment(method){if(state!=='payment')return;chosenMethod=method;state='confirm';document.getElementById('paymentPanel').classList.add('confirm-mode');document.querySelectorAll('.method').forEach(b=>b.classList.toggle('active',b.dataset.method===method));document.getElementById('micBtn').classList.add('listening');document.getElementById('panelKicker').textContent=lang==='EN'?'PAYMENT METHOD RECOGNIZED':'已識別付款方式';document.getElementById('panelTitle').textContent=(lang==='EN'?'You said: ':'您說：')+method;document.getElementById('panelCopy').textContent=lang==='EN'?'Is that correct? Say “Yes” or “No”.':'是否正確？請說「是」或「否」。';document.getElementById('micHelp').textContent='';document.getElementById('confirmControls').hidden=false;document.getElementById('paidInfo').hidden=true;document.getElementById('resultInfo').hidden=true;document.getElementById('methods').style.opacity='.72';}
function resetPayment(){state='payment';chosenMethod='';winner=null;stopDraw();document.getElementById('paymentPanel').classList.remove('confirm-mode');document.getElementById('drawingText').hidden=true;document.getElementById('drawingText').classList.remove('countdown');document.getElementById('panelKicker').hidden=false;gifts=loadGifts();buildGiftBar(false);document.getElementById('panelTitle').hidden=false;document.getElementById('panelCopy').hidden=false;document.querySelectorAll('.method').forEach(b=>b.classList.remove('active'));document.getElementById('micBtn').classList.add('listening');document.getElementById('micBtn').disabled=false;document.getElementById('methods').hidden=false;document.getElementById('methods').style.opacity='1';document.getElementById('confirmControls').hidden=true;document.getElementById('paidInfo').hidden=true;document.getElementById('resultInfo').hidden=true;document.getElementById('panelKicker').textContent=lang==='EN'?'VOICE PAYMENT':'語音付款';document.getElementById('panelTitle').textContent=lang==='EN'?'How would you like to pay today?':'今天您想如何付款？';document.getElementById('panelCopy').textContent=lang==='EN'?'Tap a payment method or say its name to the microphone.':'點擊付款方式，或對著麥克風說出付款方式。';document.getElementById('micHelp').textContent=lang==='EN'?'Listening for your payment method…':'正在聆聽您的付款方式⋯';document.getElementById('micHelp').hidden=false;document.getElementById('micBtn').hidden=false;setLanguage();if(document.getElementById('intro').hidden)startAmbientDraw()}
function startSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('panelCopy').textContent=lang==='EN'?'Voice input is not supported here. Please use the on-screen buttons.':'此瀏覽器不支援語音輸入，請使用畫面上的按鈕。';return}if(state!=='payment'&&state!=='confirm')return;try{speechRec=new SR();speechRec.lang=lang==='TC'?'zh-HK':'en-HK';speechRec.interimResults=false;speechRec.maxAlternatives=1;document.getElementById('micBtn').classList.add('listening');document.getElementById('panelCopy').textContent=state==='confirm'?(lang==='EN'?'Listening for Yes or No…':'正在聆聽「是」或「否」⋯'):(lang==='EN'?'Listening for a payment method…':'正在聆聽付款方式⋯');speechRec.onresult=e=>{const said=(e.results[0][0].transcript||'').toLowerCase().trim();if(state==='confirm'){if(/\b(yes|yeah|yep|correct|confirm|是|對|正确|正確)\b/.test(said)||said==='yes'){confirmPayment();return}if(/\b(no|nope|incorrect|cancel|否|不對|不正确|不正確)\b/.test(said)||said==='no'){resetPayment();return}document.getElementById('panelCopy').textContent=lang==='EN'?'Please say “Yes” or “No”, or tap a button.':'請說「是」或「否」，或點擊按鈕。';return}const match=[['alipay','Alipay'],['apple pay','Apple Pay'],['applepay','Apple Pay'],['google pay','Google Pay'],['g pay','Google Pay'],['octopus','Octopus'],['wechat pay','WeChat Pay'],['we chat pay','WeChat Pay'],['payme','PayMe'],['pay me','PayMe']].find(([k])=>said.includes(k));if(match)choosePayment(match[1]);else{document.getElementById('panelCopy').textContent=lang==='EN'?'Payment method not recognized. Tap a logo to choose.':'未能識別付款方式，請點擊標誌選擇。';document.getElementById('micBtn').classList.remove('listening')}};speechRec.onerror=e=>{document.getElementById('micBtn').classList.remove('listening');if(e.error&&e.error!=='no-speech')autoListen=false};speechRec.onend=()=>{if(state==='payment'||state==='confirm'){document.getElementById('micBtn').classList.add('listening');if(autoListen)setTimeout(()=>{if(autoListen&&(state==='payment'||state==='confirm'))startSpeech()},450)}};speechRec.start()}catch(e){document.getElementById('micBtn').classList.remove('listening')}}
function confirmPayment(){if(!chosenMethod)return;autoListen=false;stopDraw();state='paid';document.getElementById('paymentPanel').classList.remove('confirm-mode');document.getElementById('confirmControls').hidden=true;document.getElementById('methods').hidden=true;document.getElementById('micBtn').hidden=true;document.getElementById('micHelp').hidden=true;document.getElementById('panelKicker').hidden=true;document.getElementById('panelTitle').hidden=true;document.getElementById('panelCopy').hidden=true;document.getElementById('paidInfo').hidden=false;document.getElementById('paidMethod').textContent=(lang==='EN'?'Paid with: ':'付款方式：')+chosenMethod;document.getElementById('drawingText').hidden=true;document.getElementById('micBtn').classList.remove('listening');buildGiftBar(false);winner=gifts[Math.floor(Math.random()*gifts.length)];setTimeout(runGiftDraw,3000)}
function runGiftDraw(){stopDraw();state='drawing';const ids=gifts.map(g=>g.id);winner=winner||gifts[Math.floor(Math.random()*gifts.length)];let cursor=0;const tickId=()=>{const id=ids[cursor%ids.length];setLit(id);cursor++;return id};const countdown=document.getElementById('drawingText');countdown.hidden=false;countdown.classList.add('countdown');let number=3;function showCountdown(){countdown.textContent=String(number);if(number>1){number--;setTimeout(showCountdown,700)}else{setTimeout(beginRevealDraw,700)}}function beginRevealDraw(){countdown.hidden=true;countdown.classList.remove('countdown');buildGiftBar(true);let fastTicks=0;const fast=setInterval(()=>{setLit(tickId());fastTicks++;if(fastTicks>=27){clearInterval(fast);slowDown()}},75)}function slowDown(){const delays=[90,105,125,150,180,215,260,315,385,470,580,700,850];let j=0;function step(){if(j<delays.length){setLit(tickId());setTimeout(step,delays[j++]);return}const finalEl=document.querySelector(`.gift[data-id="${winner.id}"]`);document.querySelectorAll('.gift').forEach(el=>el.classList.remove('lit','winner'));if(finalEl)finalEl.classList.add('winner');setTimeout(()=>showReveal(winner),2000)}step()}showCountdown()}
function showReveal(g){const overlay=document.getElementById('reveal');document.getElementById('revealImg').src=g.image;document.getElementById('revealImg').style.display=g.showImage?'block':'none';document.getElementById('revealRank').textContent=rankNames[g.id]||g.id;document.getElementById('revealName').textContent=g.name;overlay.classList.add('show');setTimeout(()=>{overlay.classList.remove('show');showResult(g)},3000)}
function showResult(g){state='result';document.getElementById('paymentPanel').classList.remove('confirm-mode');document.getElementById('panelKicker').hidden=true;document.getElementById('panelTitle').hidden=true;document.getElementById('panelCopy').hidden=true;document.getElementById('paidInfo').hidden=true;document.getElementById('methods').hidden=true;document.getElementById('confirmControls').hidden=true;document.getElementById('micBtn').hidden=true;document.getElementById('micHelp').hidden=true;document.getElementById('resultInfo').hidden=false;document.getElementById('resultImg').src=g.image;document.getElementById('resultImg').style.display=g.showImage?'block':'none';document.getElementById('resultName').textContent=g.name;document.getElementById('resultTitle').textContent=lang==='EN'?'Congratulations!':'恭喜！';}
document.getElementById('intro').addEventListener('click',()=>{document.getElementById('intro').hidden=true;startAmbientDraw();autoListen=true;startSpeech()});document.getElementById('dashboardBtn').onclick=()=>location.href='voice-pay-dashboard.html';document.getElementById('langBtn').onclick=()=>{lang=lang==='EN'?'TC':'EN';localStorage.setItem('asiapayLuckyDrawLang',lang);setLanguage()};document.querySelectorAll('.method').forEach(b=>b.addEventListener('click',()=>choosePayment(b.dataset.method)));document.getElementById('micBtn').onclick=()=>{autoListen=true;startSpeech()};document.getElementById('yesBtn').onclick=confirmPayment;document.getElementById('noBtn').onclick=()=>{resetPayment();autoListen=true;startSpeech()};document.getElementById('againBtn').onclick=()=>{resetPayment();autoListen=true;startSpeech()};document.getElementById('aboutBtn').onclick=()=>{autoListen=false;stopDraw();resetPayment();document.getElementById('intro').hidden=false};
buildGiftBar(false);setLanguage();
</script></body></html>
