<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AsiaPay Lucky Draw</title><style>
:root{--navy:#00105d;--red:#9b2915;--orange:#f99d02;--teal:#50a2a7;--ink:#172033}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#00105d,#071d79 48%,#50a2a7);min-height:100vh}.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.shell{width:min(920px,100%);min-height:680px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 24px 70px #0005}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e8ebf2}.brand{font-weight:900;color:var(--navy);letter-spacing:.04em}.lang{border:1px solid #d7dce6;background:white;border-radius:999px;padding:8px 13px;font-weight:800;color:var(--navy);cursor:pointer}.page{padding:38px 34px 30px;display:none;min-height:600px}.page.active{display:block}.center{text-align:center}.eyebrow{color:var(--orange);font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.title{font-size:clamp(42px,7vw,68px);line-height:1.02;color:var(--navy);margin:20px 0}.sub{font-size:17px;color:#5e6675;line-height:1.6;max-width:650px;margin:0 auto 28px}.btn{border:0;border-radius:14px;padding:15px 30px;font-size:17px;font-weight:900;cursor:pointer}.primary{background:var(--orange);color:var(--navy)}.wheel-stage{position:relative;width:min(470px,82vw);aspect-ratio:1;margin:20px auto}.wheel{width:100%;height:100%;border-radius:50%;border:12px solid white;box-shadow:0 12px 35px #00105d40;position:relative;overflow:hidden;background:conic-gradient(#f99d02 0 60deg,#00105d 60deg 120deg,#50a2a7 120deg 180deg,#9b2915 180deg 240deg,#f99d02 240deg 300deg,#00105d 300deg 360deg);transform:rotate(0)}.wheel.spinning{animation:spin 1.8s cubic-bezier(.12,.78,.16,1) forwards}@keyframes spin{to{transform:rotate(2160deg)}}.wheel-label{position:absolute;inset:0}.wlabel{position:absolute;left:50%;top:50%;width:140px;margin-left:-70px;margin-top:-10px;text-align:right;color:#fff;font-size:13px;font-weight:1000;text-shadow:0 1px 2px #0008}.wlabel:nth-child(1){transform:rotate(-5deg) translateX(78px)}.wlabel:nth-child(2){transform:rotate(55deg) translateX(78px)}.wlabel:nth-child(3){transform:rotate(115deg) translateX(78px)}.wlabel:nth-child(4){transform:rotate(175deg) translateX(78px)}.wlabel:nth-child(5){transform:rotate(235deg) translateX(78px)}.wlabel:nth-child(6){transform:rotate(295deg) translateX(78px)}.pointer{position:absolute;z-index:3;top:-4px;left:50%;transform:translateX(-50%);border-left:18px solid transparent;border-right:18px solid transparent;border-top:42px solid var(--red);filter:drop-shadow(0 3px 3px #0004)}.wheel-center{position:absolute;z-index:2;width:78px;height:78px;border-radius:50%;background:white;border:8px solid var(--orange);box-shadow:0 5px 14px #0003;display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:12px;font-weight:1000}.result{font-size:clamp(38px,7vw,68px);font-weight:1000;color:var(--navy);margin:18px 0}.prize-box{max-width:540px;margin:25px auto;padding:32px;border-radius:24px;background:linear-gradient(135deg,var(--navy),#18338e);color:white}.prize-name{font-size:32px;font-weight:1000;color:var(--orange)}.small{font-size:12px;color:#778092}@media(max-width:680px){.app{padding:0}.shell{border-radius:0;min-height:100vh}.page{padding:30px 18px}.wheel-stage{width:min(390px,86vw)}.wlabel{font-size:11px}}
</style></head><body><div class="app"><main class="shell"><div class="top"><div class="brand">ASIAPAY</div><button class="lang" id="langBtn">TC</button></div>
<section class="page active center" id="intro"><div class="eyebrow">HK FinTech Week 2026</div><div class="title">LUCKY DRAW!</div><p class="sub">Tap START and let the lucky draw decide your prize.</p><button class="btn primary" onclick="startDraw()">START!</button></section>
<section class="page center" id="drawing"><div class="eyebrow">Good Luck!</div><div class="title" style="font-size:40px">Let's Spin!</div><div class="wheel-stage"><div class="pointer"></div><div class="wheel" id="wheel"><div class="wheel-label"><div class="wlabel">1st Prize</div><div class="wlabel">2nd Prize</div><div class="wlabel">3rd Prize</div><div class="wlabel">4th Prize</div><div class="wlabel">5th Prize</div><div class="wlabel">No Prize</div></div></div><div class="wheel-center">LUCKY<br>DRAW</div></div><p class="sub">Your result is being prepared...</p></section>
<section class="page center" id="result"><div class="eyebrow">Lucky Draw Result</div><div class="result" id="resultTitle">Congratulations!</div><div class="prize-box"><div class="small">Your result</div><div class="prize-name" id="prizeName">5th Prize</div><p id="resultDesc">You won a prize!</p></div><button class="btn primary" onclick="resetGame()">Play Again</button></section>
</main></div><script>
const KEY='asiapayLuckyDrawConfigV1',LANGKEY='asiapayLuckyDrawLang';let lang=localStorage.getItem(LANGKEY)||'EN';const defaults={mode:'TEST',prizes:[{id:'p1',name:'1st Prize',weight:1,stock:1,dailyLimit:1,used:0,enabled:true},{id:'p2',name:'2nd Prize',weight:3,stock:5,dailyLimit:null,used:0,enabled:true},{id:'p3',name:'3rd Prize',weight:6,stock:10,dailyLimit:null,used:0,enabled:true},{id:'p4',name:'4th Prize',weight:15,stock:30,dailyLimit:null,used:0,enabled:true},{id:'p5',name:'5th Prize',weight:30,stock:100,dailyLimit:null,used:0,enabled:true},{id:'np',name:'No Prize',weight:45,stock:null,dailyLimit:null,used:0,enabled:true}],history:[]};function cfg(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){return structuredClone(defaults)}}function save(c){localStorage.setItem(KEY,JSON.stringify(c))}if(!localStorage.getItem(KEY))save(defaults);function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}function pickWinner(c){const a=c.prizes.filter(p=>p.enabled&&(p.stock===null||p.stock>p.used)&&(!p.dailyLimit||p.used<p.dailyLimit)&&p.weight>0);if(!a.length)return null;let total=a.reduce((n,p)=>n+p.weight,0),r=Math.random()*total;for(const p of a){r-=p.weight;if(r<=0)return p}return a[a.length-1]}function startDraw(){const c=cfg(),winner=pickWinner(c);if(!winner){alert('No prize is currently available.');return}show('drawing');const w=document.getElementById('wheel');w.classList.remove('spinning');void w.offsetWidth;w.classList.add('spinning');setTimeout(()=>{if(c.mode==='LIVE'&&winner.stock!==null)winner.used++;c.history.push({drawId:'LD'+Date.now(),time:new Date().toISOString(),gift:'LUCKY_DRAW',result:winner.name,mode:c.mode});if(c.history.length>500)c.history.shift();save(c);document.getElementById('resultTitle').textContent=winner.id==='np'?'Better luck next time!':'Congratulations!';document.getElementById('prizeName').textContent=winner.name;document.getElementById('resultDesc').textContent=winner.id==='np'?'No prize this time. Thank you for playing!':'You won a prize! Please follow the staff instructions to collect it.';show('result')},1850)}function resetGame(){document.getElementById('wheel').classList.remove('spinning');show('intro')}document.getElementById('langBtn').onclick=()=>{lang=lang==='EN'?'TC':'EN';localStorage.setItem(LANGKEY,lang);document.getElementById('langBtn').textContent=lang==='EN'?'TC':'EN'};document.getElementById('langBtn').textContent=lang==='EN'?'TC':'EN';
</script></body></html>
