<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AsiaPay Lucky Draw</title>
<style>
:root{--navy:#00105d;--red:#9b2915;--orange:#f99d02;--teal:#50a2a7;--white:#fff;--bg:#f5f7fb;--ink:#172033}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(145deg,#00105d 0%,#071d79 48%,#50a2a7 140%);color:var(--ink);min-height:100vh}
.app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.shell{width:min(920px,100%);min-height:680px;background:rgba(255,255,255,.97);border-radius:28px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.28);position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e8ebf2}.brand{font-weight:900;color:var(--navy);letter-spacing:.04em}.top-actions{display:flex;gap:8px;align-items:center}.lang,.dash{border:1px solid #d7dce6;background:white;border-radius:999px;padding:8px 13px;font-weight:800;color:var(--navy);cursor:pointer}.dash{text-decoration:none}
.page{padding:38px 34px 30px;display:none;min-height:600px}.page.active{display:block}.center{text-align:center}.eyebrow{color:var(--orange);font-size:13px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.title{font-size:clamp(34px,6vw,58px);line-height:1.02;color:var(--navy);margin:14px 0}.sub{font-size:17px;color:#5e6675;line-height:1.6;max-width:650px;margin:0 auto 28px}
.btn{border:0;border-radius:14px;padding:15px 25px;font-size:16px;font-weight:900;cursor:pointer}.primary{background:var(--orange);color:var(--navy)}.secondary{background:#eef1f7;color:var(--navy)}.danger{background:var(--red);color:white}.actions{display:flex;justify-content:center;gap:12px;margin-top:22px}
.wheel-wrap{position:relative;width:min(470px,78vw);aspect-ratio:1;margin:25px auto 10px}.wheel{position:absolute;inset:0;border-radius:50%;border:10px solid #fff;box-shadow:0 12px 30px rgba(0,0,0,.22);overflow:hidden;transition:transform 4.8s cubic-bezier(.12,.78,.12,1);background:#ddd}.wheel::after{content:"";position:absolute;inset:8%;border-radius:50%;border:2px solid rgba(255,255,255,.5);pointer-events:none}.wheel-label{position:absolute;left:50%;top:50%;width:44%;transform-origin:0 50%;font-weight:1000;font-size:clamp(10px,1.8vw,15px);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.65);white-space:nowrap;text-align:right;pointer-events:none}.pointer{position:absolute;z-index:5;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:0;border-bottom:35px solid var(--red);filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}.hub{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:#fff;border:8px solid var(--orange);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.result{font-size:clamp(38px,7vw,68px);font-weight:1000;color:var(--navy);margin:18px 0}.prize-box{max-width:540px;margin:25px auto;padding:32px;border-radius:24px;background:linear-gradient(135deg,var(--navy),#18338e);color:white}.prize-name{font-size:32px;font-weight:1000;color:var(--orange)}.small{font-size:12px;color:#d8def1}.pulse{animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(1.03)}}
@media(max-width:680px){.app{padding:0}.shell{border-radius:0;min-height:100vh}.page{padding:30px 18px;min-height:calc(100vh - 70px)}.top{padding:14px 16px}.wheel-wrap{width:min(390px,86vw)}.actions{justify-content:stretch}.actions .btn{flex:1}.dash{display:none}}
</style>
</head>
<body>
<div class="app"><main class="shell">
<div class="top"><div class="brand">ASIAPAY</div><div class="top-actions"><a class="dash" href="lucky-draw-dashboard.html">Dashboard</a><button class="lang" id="langBtn">TC</button></div></div>

<section class="page active center" id="intro">
<div class="eyebrow">HK FinTech Week 2026</div><div class="title">LUCKY DRAW!</div>
<p class="sub">Try your luck and see what prize you win.</p>
<button class="btn primary" onclick="startDraw()">START!</button>
</section>

<section class="page center" id="drawing">
<div class="eyebrow">Good Luck!</div><div class="title" style="font-size:40px">Drawing...</div>
<div class="wheel-wrap"><div class="pointer"></div><div class="wheel" id="wheel"></div><div class="hub"></div></div>
<p class="sub pulse">Please wait for your result</p>
</section>

<section class="page center" id="result">
<div class="eyebrow">Lucky Draw Result</div><div class="result" id="resultTitle">Congratulations!</div>
<div class="prize-box" id="prizeBox"><div class="small">Your result</div><div class="prize-name" id="prizeName">5th Prize</div><p id="resultDesc">You won a prize!</p></div>
<div class="actions"><button class="btn primary" onclick="resetGame()">Play Again</button></div>
</section>
</main></div>
<script>
const KEY='asiapayLuckyDrawConfigV1';
const LANGKEY='asiapayLuckyDrawLang';
let lang=localStorage.getItem(LANGKEY)||'EN';
const defaultConfig={mode:'TEST',prizes:[
{id:'p1',name:'1st Prize',weight:1,stock:1,dailyLimit:1,used:0,enabled:true},
{id:'p2',name:'2nd Prize',weight:3,stock:5,dailyLimit:null,used:0,enabled:true},
{id:'p3',name:'3rd Prize',weight:6,stock:10,dailyLimit:null,used:0,enabled:true},
{id:'p4',name:'4th Prize',weight:15,stock:30,dailyLimit:null,used:0,enabled:true},
{id:'p5',name:'5th Prize',weight:30,stock:100,dailyLimit:null,used:0,enabled:true},
{id:'np',name:'No Prize',weight:45,stock:null,dailyLimit:null,used:0,enabled:true}
],history:[]};
function cfg(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaultConfig)}catch(e){return structuredClone(defaultConfig)}}
function save(c){localStorage.setItem(KEY,JSON.stringify(c))}
if(!localStorage.getItem(KEY))save(defaultConfig);
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function getAvailable(c){return c.prizes.filter(p=>p.enabled && (p.stock===null || p.stock>p.used) && (!p.dailyLimit || p.used<p.dailyLimit) && p.weight>0)}
function weightedWinner(available){
 let total=available.reduce((a,p)=>a+p.weight,0), r=Math.random()*total;
 for(const p of available){r-=p.weight;if(r<=0)return p}
 return available[available.length-1];
}
function buildWheel(items){
 const wheel=document.getElementById('wheel');
 wheel.innerHTML='';
 if(!items.length){wheel.style.background='#ddd';return}
 const total=items.reduce((a,p)=>a+p.weight,0);
 let cursor=0, stops=[];
 const parts=[];
 items.forEach((p,i)=>{
   const start=cursor/total*360, end=(cursor+p.weight)/total*360;
   const colors=['#00105d','#f99d02','#50a2a7','#18338e','#9b2915','#6674a8'];
   parts.push(`${colors[i%colors.length]} ${start}deg ${end}deg`);
   const mid=(start+end)/2;
   const label=document.createElement('div');
   label.className='wheel-label';
   label.textContent=p.name;
   label.style.transform=`rotate(${mid}deg) translateX(-100%)`;
   wheel.appendChild(label);
   stops.push({id:p.id,start,end,mid});
   cursor+=p.weight;
 });
 wheel.style.background=`conic-gradient(from 0deg,${parts.join(',')})`;
 return stops;
}
function spinToWinner(items,winner){
 const stops=buildWheel(items);
 const stop=stops.find(s=>s.id===winner.id) || stops[0];
 const target=5*360 + (360-stop.mid);
 const wheel=document.getElementById('wheel');
 wheel.style.transition='none';
 wheel.style.transform='rotate(0deg)';
 void wheel.offsetWidth;
 wheel.style.transition='transform 4.8s cubic-bezier(.12,.78,.12,1)';
 wheel.style.transform=`rotate(${target}deg)`;
 return 4850;
}
function startDraw(){
 const c=cfg();
 const available=getAvailable(c);
 if(!available.length){alert('No prize is currently available.');return}
 show('drawing');
 const winner=weightedWinner(available);
 const delay=spinToWinner(available,winner);
 setTimeout(()=>finishDraw(c,winner),delay);
}
function finishDraw(c,winner){
 // In LIVE mode, consume the stock/daily limit so exhausted prizes disappear from future wheels.
 if(c.mode==='LIVE'){
   if(winner.stock!==null) winner.used++;
   else if(winner.dailyLimit) winner.used++;
 }
 const id='LD'+Date.now();
 c.history=c.history||[];
 c.history.push({drawId:id,time:new Date().toISOString(),result:winner.name,mode:c.mode});
 if(c.history.length>500)c.history.shift();
 save(c);
 document.getElementById('resultTitle').textContent=winner.id==='np'?'Better luck next time!':'Congratulations!';
 document.getElementById('prizeName').textContent=winner.name;
 document.getElementById('resultDesc').textContent=winner.id==='np'?'No prize this time. Thank you for playing!':'You won a prize! Please follow the staff instructions to collect it.';
 show('result');
}
function resetGame(){document.getElementById('wheel').style.transform='rotate(0deg)';show('intro')}
document.getElementById('langBtn').onclick=()=>{lang=lang==='EN'?'TC':'EN';localStorage.setItem(LANGKEY,lang);document.getElementById('langBtn').textContent=lang==='EN'?'TC':'EN';alert('Language toggle is ready for bilingual copy.')}
document.getElementById('langBtn').textContent=lang==='EN'?'TC':'EN';
</script>
</body></html>
